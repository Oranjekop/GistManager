name: Native build and release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.meta.outputs.publish }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: meta
        shell: bash
        run: |
          VERSION=$(jq -r .version mygo.json)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          PUBLISH=false
          TAG=pre-release
          PRERELEASE=true
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            if [[ "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match mygo.json version $VERSION."
              exit 1
            fi
            TAG="$GITHUB_REF_NAME"
            PRERELEASE=false
            PUBLISH=true
          elif [[ "$GITHUB_EVENT_NAME" != pull_request && "$GITHUB_REF" == refs/heads/main ]]; then
            STABLE_TAG=$(git tag --points-at "$GITHUB_SHA" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
            if [[ -z "$STABLE_TAG" ]]; then
              VERSION="$VERSION-beta.$GITHUB_RUN_NUMBER.${GITHUB_SHA:0:7}"
              PUBLISH=true
            fi
          fi
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./... -timeout 120s
      - run: go vet ./...

  build:
    name: Build (${{ matrix.target }})
    needs: [prepare, test]
    if: needs.prepare.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: windows/amd64, target: windows-amd64 }
          - { os: windows-latest, platform: windows/arm64, target: windows-arm64 }
          - { os: macos-15-intel, platform: darwin/amd64, target: darwin-amd64 }
          - { os: macos-15, platform: darwin/arm64, target: darwin-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build native application and installer
        shell: bash
        run: go run ./cmd/release build -platform '${{ matrix.platform }}' -version '${{ needs.prepare.outputs.version }}'
      - name: Verify macOS bundle
        if: runner.os == 'macOS'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          APP="dist/$TARGET/Gist管理器.app"
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")" = "$VERSION"
          test "$("$APP/Contents/MacOS/$EXECUTABLE" --version)" = "$VERSION"
          ARCH=x86_64
          if [[ "$TARGET" == darwin-arm64 ]]; then ARCH=arm64; fi
          lipo "$APP/Contents/MacOS/$EXECUTABLE" -verify_arch "$ARCH"
          codesign --verify --deep --strict --verbose=2 "$APP"
      - name: Create portable archive
        shell: bash
        run: go run ./cmd/release pack -unsigned -platform '${{ matrix.target }}' -version '${{ needs.prepare.outputs.version }}' -tag '${{ needs.prepare.outputs.tag }}'
      - name: Collect and verify release assets
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          shopt -s nullglob
          if [[ "$RUNNER_OS" == macOS ]]; then
            INSTALLERS=(dist/"$TARGET"/*.dmg)
            DESTINATION="GistManager-$VERSION-$TARGET.dmg"
          else
            INSTALLERS=(dist/"$TARGET"/*Setup*.exe)
            DESTINATION="GistManager-Setup-$VERSION-$TARGET.exe"
          fi
          test "${#INSTALLERS[@]}" -eq 1
          cp "${INSTALLERS[0]}" "release/$DESTINATION"
          test -s "release/$DESTINATION"
          test -s "release/GistManager-$VERSION-$TARGET.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.target }}
          path: release/*
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          merge-multiple: true
          path: release
      - name: Publish completed artifacts
        shell: bash
        run: |
          TAG='${{ needs.prepare.outputs.tag }}'
          VERSION='${{ needs.prepare.outputs.version }}'
          PRERELEASE='${{ needs.prepare.outputs.prerelease }}'
          for TARGET in windows-amd64 windows-arm64 darwin-amd64 darwin-arm64; do
            test -s "release/GistManager-$VERSION-$TARGET.zip"
            if [[ "$TARGET" == darwin-* ]]; then
              test -s "release/GistManager-$VERSION-$TARGET.dmg"
            else
              test -s "release/GistManager-Setup-$VERSION-$TARGET.exe"
            fi
          done
          test "$(find release -maxdepth 1 -type f | wc -l)" -eq 8
          (cd release && sha256sum * > SHA256SUMS.txt)
          LATEST=true
          if [[ "$TAG" == pre-release ]]; then
            git tag --force pre-release "$GITHUB_SHA"
            git push origin refs/tags/pre-release --force
            LATEST=false
          fi
          NOTES=(--generate-notes)
          if [[ -f "docs/releases/$VERSION.md" ]]; then NOTES=(--notes-file "docs/releases/$VERSION.md"); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --draft --prerelease="$PRERELEASE" --title "v$VERSION"
          else
            gh release create "$TAG" --draft --verify-tag --prerelease="$PRERELEASE" --title "v$VERSION" "${NOTES[@]}"
          fi
          gh release upload "$TAG" release/* --clobber
          gh release edit "$TAG" --draft=false --prerelease="$PRERELEASE" --latest="$LATEST"
