name: Native build and release

on:
  push:
    branches: [main]
    tags: ['v*.*.*', '!v*.*.*-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.meta.outputs.publish }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: meta
        shell: bash
        run: |
          VERSION=$(jq -r .version mygo.json)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          PUBLISH=false
          TAG="v$VERSION"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            if [[ "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match mygo.json version $VERSION."
              exit 1
            fi
            TAG="$GITHUB_REF_NAME"
            PUBLISH=true
          fi
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./... -timeout 120s
      - run: go vet ./...

  build:
    name: Build (${{ matrix.target }})
    needs: [prepare, test]
    if: needs.prepare.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: windows/universal, target: windows-universal, updateOS: windows }
          - { os: macos-15, platform: darwin/universal, target: darwin-universal, updateOS: darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build native application and installer
        shell: bash
        run: go run ./cmd/release build -platform '${{ matrix.platform }}' -version '${{ needs.prepare.outputs.version }}'
      - name: Verify Windows installer architecture selection
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GIST_TEST_INSTALLER: '1'
        run: go test ./cmd/release -run '^TestUniversalInstallerInstallsNativePayload$' -count=1 -timeout 60s
      - name: Build macOS applications for architecture-specific updates
        if: runner.os == 'macOS'
        shell: bash
        run: go run ./cmd/release build -platform darwin/amd64,darwin/arm64 -skip-dmg -version '${{ needs.prepare.outputs.version }}'
      - name: Verify macOS bundles
        if: runner.os == 'macOS'
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          for ARCH in universal amd64 arm64; do
            APP="dist/darwin-$ARCH/Gist管理器.app"
            EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")" = "$VERSION"
            case "$ARCH" in
              universal) lipo "$APP/Contents/MacOS/$EXECUTABLE" -verify_arch x86_64 arm64
                         test "$("$APP/Contents/MacOS/$EXECUTABLE" --version)" = "$VERSION" ;;
              amd64) lipo "$APP/Contents/MacOS/$EXECUTABLE" -verify_arch x86_64 ;;
              arm64) lipo "$APP/Contents/MacOS/$EXECUTABLE" -verify_arch arm64 ;;
            esac
            codesign --verify --deep --strict --verbose=2 "$APP"
          done
      - name: Create portable archive
        shell: bash
        env:
          UPDATE_OS: ${{ matrix.updateOS }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          for ARCH in amd64 arm64; do
            go run ./cmd/release pack -unsigned -platform "$UPDATE_OS-$ARCH" -version "$VERSION" -tag "$TAG"
          done
      - name: Collect and verify release assets
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          UPDATE_OS: ${{ matrix.updateOS }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then
            SLUG=$(jq -r .slug mygo.json)
            INSTALLER="dist/$TARGET/$SLUG-$VERSION.dmg"
            DESTINATION="GistManager-$VERSION-macos.dmg"
          else
            INSTALLER="dist/$TARGET/Gist管理器 Setup $VERSION.exe"
            DESTINATION="GistManager-Setup-$VERSION-windows.exe"
          fi
          cp "$INSTALLER" "release/$DESTINATION"
          test -s "release/$DESTINATION"
          for ARCH in amd64 arm64; do
            test -s "release/GistManager-$VERSION-$UPDATE_OS-$ARCH.zip"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.target }}
          path: release/*
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          merge-multiple: true
          path: release
      - name: Publish completed artifacts
        shell: bash
        run: |
          TAG='${{ needs.prepare.outputs.tag }}'
          VERSION='${{ needs.prepare.outputs.version }}'
          for TARGET in windows-amd64 windows-arm64 darwin-amd64 darwin-arm64; do
            test -s "release/GistManager-$VERSION-$TARGET.zip"
          done
          test -s "release/GistManager-Setup-$VERSION-windows.exe"
          test -s "release/GistManager-$VERSION-macos.dmg"
          test "$(find release -maxdepth 1 -type f | wc -l)" -eq 6
          (cd release && sha256sum * > SHA256SUMS.txt)
          NOTES=(--generate-notes)
          if [[ -f "docs/releases/$VERSION.md" ]]; then NOTES=(--notes-file "docs/releases/$VERSION.md"); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --draft --prerelease=false --title "v$VERSION"
          else
            gh release create "$TAG" --draft --verify-tag --prerelease=false --title "v$VERSION" "${NOTES[@]}"
          fi
          gh release upload "$TAG" release/* --clobber
          gh release edit "$TAG" --draft=false --prerelease=false --latest=true
